  /* =========================================================
     Song add / edit modal
  ========================================================= */

  function openSongModal(song = null) {
    const modal = $('modal-song');
    const form = $('song-form');

    if (!modal || !form) return;

    state.editingSongId = song?.id || null;
    state.pendingAudioFile = null;
    state.pendingCoverFile = null;
    state.pendingLrcFile = null;

    $('song-modal-title').textContent =
      song ? '노래 정보 수정' : '노래 추가';

    $('song-id').value = song?.id || '';

    $('field-title').value = song?.title || '';
    $('field-artist').value = song?.artist || '';
    $('field-album').value = song?.album || '';
    $('field-year').value = song?.year || '';
    $('field-genre').value = song?.genre || '';

    $('audio-file-name').textContent =
      song?.audioBlob
        ? '현재 음악 파일 사용 중'
        : 'MP3, WAV, M4A 파일을 선택하세요';

    $('lrc-file-name').textContent =
      song?.lyricsType === 'lrc'
        ? '현재 LRC 가사 사용 중'
        : '.lrc 파일 선택 (선택사항)';

    $('lyrics-textarea').value =
      song?.lyricsType === 'plain'
        ? song.lyricsRaw || ''
        : '';

    const coverPreview = $('cover-preview');

    if (coverPreview) {
      if (song?.coverBlob) {
        coverPreview.style = coverStyle(song);
        coverPreview.innerHTML = '';
      } else {
        coverPreview.style.backgroundImage = '';
        coverPreview.innerHTML =
          '<span class="cover-placeholder">🖼️</span>';
      }

    if (song?.lyricsType === 'plain') {
      switchLyricsTab('type');
    } else {
      switchLyricsTab('upload');
    }

    openModal(modal);

  function switchLyricsTab(tab) {
    state.modalLyricsTab = tab;

    qsa('.lyrics-tab').forEach((button) => {
      button.classList.toggle(
        'active',
        button.dataset.lyricsTab === tab
      );
    });

    $('lyrics-panel-upload')?.classList.toggle(
      'hidden',
      tab !== 'upload'
    );

    $('lyrics-panel-type')?.classList.toggle(
      'hidden',
      tab !== 'type'
    );
  }

  async function handleSongFormSubmit(event) {
    event.preventDefault();

    const title = $('field-title').value.trim();
    const artist = $('field-artist').value.trim();

    if (!title || !artist) {
      showToast('곡 제목과 아티스트를 입력해주세요.');
      return;
    }

    const editing = state.editingSongId
      ? await DB.getSong(state.editingSongId)
      : null;

    let audioBlob = editing?.audioBlob || null;
    let audioType = editing?.audioType || '';

    if (state.pendingAudioFile) {
      audioBlob = state.pendingAudioFile;
      audioType = state.pendingAudioFile.type || '';
    }

    if (!audioBlob) {
      showToast('음악 파일을 선택해주세요.');
      return;
    }

    let coverBlob = editing?.coverBlob || null;

    if (state.pendingCoverFile) {
      coverBlob = state.pendingCoverFile;
    }

    let lyricsType = editing?.lyricsType || 'none';
    let lyricsRaw = editing?.lyricsRaw || '';

    if (state.modalLyricsTab === 'type') {
      const typed = $('lyrics-textarea').value.trim();

      if (typed) {
        lyricsType = 'plain';
        lyricsRaw = typed;
      } else {
        lyricsType = 'none';
        lyricsRaw = '';
      }
    } else if (state.pendingLrcFile) {
      lyricsRaw = await state.pendingLrcFile.text();
      lyricsType = 'lrc';
    } else if (!editing) {
      lyricsType = 'none';
      lyricsRaw = '';
    }

    const songData = {
      title,
      artist,
      album: $('field-album').value.trim(),
      year: $('field-year').value.trim(),
      genre: $('field-genre').value.trim(),
      coverBlob,
      audioBlob,
      audioType,
      lyricsType,
      lyricsRaw
    };

    try {
      if (editing) {
        const updated = await DB.updateSong(
          editing.id,
          songData
        );

        if (updated) {
          revokeCoverURL(updated.id);
          replaceSong(updated);

          if (state.currentSongId === updated.id) {
            updateLyrics(updated);
            setupMediaSession(updated);
          }

          showToast('노래 정보가 수정됐어요.');
        }
      } else {
        const added = await DB.addSong(songData);

        state.songs.push(added);

        showToast('노래가 추가됐어요.');
      }

      closeModal($('modal-song'));
      resetSongForm();

      renderAll();
    } catch (error) {
      console.error(error);
      showToast('노래를 저장하지 못했어요.');
    }
  }

  function resetSongForm() {
    $('song-form')?.reset();

    state.editingSongId = null;
    state.pendingAudioFile = null;
    state.pendingCoverFile = null;
    state.pendingLrcFile = null;

    $('cover-preview').style.backgroundImage = '';
    $('cover-preview').innerHTML =
      '<span class="cover-placeholder">🖼️</span>';

    $('audio-file-name').textContent =
      'MP3, WAV, M4A 파일을 선택하세요';

    $('lrc-file-name').textContent =
      '.lrc 파일 선택 (선택사항)';
  }

  /* =========================================================
     Playlist modal
  ========================================================= */

  function openPlaylistModal(playlist = null) {
    state.editingPlaylistId = playlist?.id || null;

    $('playlist-modal-title').textContent =
      playlist
        ? '플레이리스트 수정'
        : '새 플레이리스트';

    $('playlist-id').value = playlist?.id || '';
    $('playlist-name').value = playlist?.name || '';
    $('playlist-emoji').value =
      playlist?.emoji || '🎵';

    openModal($('modal-playlist'));
  }

  async function handlePlaylistSubmit(event) {
    event.preventDefault();

    const name = $('playlist-name').value.trim();
    const emoji =
      $('playlist-emoji').value.trim() || '🎵';

    if (!name) {
      showToast('플레이리스트 이름을 입력해주세요.');
      return;
    }

    try {
      if (state.editingPlaylistId) {
        const updated = await DB.updatePlaylist(
          state.editingPlaylistId,
          {
            name,
            emoji
          }
        );

        if (updated) {
          const index = state.playlists.findIndex(
            (p) => p.id === updated.id
          );

          if (index >= 0) {
            state.playlists[index] = updated;
          }

          showToast('플레이리스트가 수정됐어요.');
        }
      } else {
        const playlist = await DB.addPlaylist({
          name,
          emoji
        });

        state.playlists.push(playlist);

        showToast('플레이리스트가 만들어졌어요.');
      }

      closeModal($('modal-playlist'));

      renderAll();
    } catch (error) {
      console.error(error);
      showToast('플레이리스트를 저장하지 못했어요.');
    }
  }

  async function confirmDeletePlaylist(id) {
    const playlist = state.playlists.find(
      (p) => p.id === id
    );

    if (!playlist) return;

    const confirmed = await showConfirm(
      `"${playlist.name}" 플레이리스트를 삭제할까요?\n\n음악 파일 자체는 삭제되지 않습니다.`,
      { title: '플레이리스트 삭제' }
    );

    if (!confirmed) return;

    await DB.deletePlaylist(id);

    state.playlists = state.playlists.filter(
      (p) => p.id !== id
    );

    if (state.playlistDetailId === id) {
      setView('playlists');
    } else {
      renderAll();
    }

    showToast('플레이리스트가 삭제됐어요.');
  }

  /* =========================================================
     Add to playlist modal
  ========================================================= */

  async function openAddToPlaylistModal(songId) {
    state.contextSongId = songId;

    const list = $('add-to-playlist-list');

    if (!list) return;

    if (!state.playlists.length) {
      list.innerHTML = `
        ${renderEmptyState(
          '📋',
          '플레이리스트가 없습니다',
          '아래 버튼으로 새 플레이리스트를 만들어보세요.'
        )}
      `;
    } else {
      list.innerHTML = state.playlists.map((playlist) => {
        const checked =
          playlist.songIds.includes(songId);

        return `
          <div
            class="atp-item ${checked ? 'checked' : ''}"
            data-playlist-id="${playlist.id}"
          >
            <div class="atp-emoji">
              ${escapeHTML(playlist.emoji || '🎵')}
            </div>

            <div class="atp-name">
              ${escapeHTML(playlist.name)}
            </div>

            <div class="atp-check">
              ${checked ? '✓' : ''}
            </div>
          </div>
        `;
      }).join('');

      qsa('.atp-item', list).forEach((item) => {
        item.addEventListener('click', async () => {
          const playlistId =
            item.dataset.playlistId;

          const playlist =
            state.playlists.find(
              (p) => p.id === playlistId
            );

          if (!playlist) return;

          if (playlist.songIds.includes(songId)) {
            const updated =
              await DB.removeSongFromPlaylist(
                playlistId,
                songId
              );

            replacePlaylist(updated);
            item.classList.remove('checked');
            qs('.atp-check', item).textContent = '';
            showToast('플레이리스트에서 제거했어요.');
          } else {
            const updated =
              await DB.addSongToPlaylist(
                playlistId,
                songId
              );

            replacePlaylist(updated);
            item.classList.add('checked');
            qs('.atp-check', item).textContent = '✓';
            showToast('플레이리스트에 추가했어요.');
          }

          renderSidebarPlaylists();
        });
      });
    }

    openModal($('modal-add-to-playlist'));
  }

  function replacePlaylist(playlist) {
    if (!playlist) return;

    const index = state.playlists.findIndex(
      (p) => p.id === playlist.id
    );

    if (index >= 0) {
      state.playlists[index] = playlist;
    }
  }

  /* =========================================================
     Context menu
  ========================================================= */

  function openContextMenu(event, songId, playlistId = null) {
    const menu = $('context-menu');

    if (!menu) return;

    state.contextSongId = songId;
    state.contextPlaylistId = playlistId;

    const removeButton =
      qs('[data-action="remove-from-playlist"]', menu);

    if (removeButton) {
      removeButton.classList.toggle(

      );

    menu.classList.remove('hidden');

    const x = event.clientX;
    const y = event.clientY;

    const menuWidth = 210;
    const menuHeight = 230;

    menu.style.left =
      `${Math.min(
        x,
        window.innerWidth - menuWidth - 12
      )}px`;

    menu.style.top =
      `${Math.min(
        y,
        window.innerHeight - menuHeight - 12
      )}px`;

    requestAnimationFrame(() => {
      menu.classList.add('show');
    });
  }

  function closeContextMenu() {
    const menu = $('context-menu');

    if (!menu) return;

    menu.classList.remove('show');

    setTimeout(() => {
      menu.classList.add('hidden');
    }, 150);
  }

  async function handleContextAction(action) {
    const songId = state.contextSongId;

    if (!songId) return;

    switch (action) {
      case 'play':
        await playSong(songId);
        break;

      case 'like': {
        const updated = await DB.toggleLike(songId);

        if (updated) {
          replaceSong(updated);
          renderAll();
        }

        break;
      }

      case 'add-to-playlist':
        await openAddToPlaylistModal(songId);
        break;

      case 'edit': {
        const song = await DB.getSong(songId);

        if (song) {
          openSongModal(song);
        }

        break;
      }

      case 'remove-from-playlist': {
        if (!state.contextPlaylistId) break;

        const updated =
          await DB.removeSongFromPlaylist(
            state.contextPlaylistId,
            songId
          );

        replacePlaylist(updated);

        renderAll();

        showToast('플레이리스트에서 제거했어요.');
        break;
      }

      case 'delete':
        await confirmDeleteSong(songId);
        break;
    }

    closeContextMenu();
  }

  async function confirmDeleteSong(songId) {
    const song = state.songs.find(
      (item) => item.id === songId
    );

    if (!song) return;

    const confirmed = await showConfirm(
      `"${song.title}"을(를) 삭제할까요?\n\n이 음악은 모든 플레이리스트에서도 제거됩니다.`,
      { title: '음악 삭제' }
    );

    if (!confirmed) return;

    if (state.currentSongId === songId) {
      audio.pause();

      if (state.audioObjectUrl) {
        URL.revokeObjectURL(state.audioObjectUrl);
        state.audioObjectUrl = null;
      }

      audio.removeAttribute('src');
      audio.load();

      state.currentSongId = null;
      state.isPlaying = false;
      state.currentLyrics = [];
      state.activeLyricIndex = -1;
    }

    revokeCoverURL(songId);

    await DB.deleteSong(songId);

    state.songs = state.songs.filter(
      (item) => item.id !== songId
    );

    state.queue = state.queue.filter(
      (id) => id !== songId
    );

    renderAll();

    showToast('음악을 삭제했어요.');
  }

  /* =========================================================
     Modal helpers
  ========================================================= */

  function openModal(modal) {
    if (!modal) return;

    modal.classList.remove('hidden');

    requestAnimationFrame(() => {
      modal.classList.add('show');
    });

    document.body.style.overflow = 'hidden';
  }

  function closeModal(modal) {
    if (!modal) return;

    modal.classList.remove('show');

    setTimeout(() => {
      modal.classList.add('hidden');

      const anyOpen = qsa('.modal-overlay')
        .some((element) =>
          !element.classList.contains('hidden')
        );

      if (!anyOpen) {
        document.body.style.overflow = '';
      }
    }, 220);
  }

  /* =========================================================
     Custom confirm dialog

     NOTE: window.confirm()/alert() are silently no-ops inside
     a sandboxed iframe without "allow-modals" (as used when this
     app is published as an Artifact) — they return false without
     ever showing anything, which used to make every delete action
     appear completely broken. This in-app modal works everywhere.
  ========================================================= */

  let confirmResolver = null;

  function showConfirm(message, { title = '삭제할까요?', okLabel = '삭제' } = {}) {
    const modal = $('modal-confirm');

    if (!modal) {
      // Extremely defensive fallback; should never happen since the
      // modal markup ships with index.html.
      return Promise.resolve(true);
    }

    $('confirm-modal-title').textContent = title;
    $('confirm-modal-message').textContent = message;
    $('confirm-modal-ok').textContent = okLabel;

    openModal(modal);

    return new Promise((resolve) => {
      confirmResolver = resolve;
    });
  }

  function resolveConfirm(result) {
    closeModal($('modal-confirm'));

    if (confirmResolver) {
      confirmResolver(result);
      confirmResolver = null;
    }
  }

  $('confirm-modal-ok')?.addEventListener('click', () => resolveConfirm(true));
  $('confirm-modal-cancel')?.addEventListener('click', () => resolveConfirm(false));

  /* =========================================================
     File inputs
  ========================================================= */

  $('cover-preview')?.addEventListener('click', () => {
    $('cover-input')?.click();
  });

  $('audio-input')?.addEventListener(
    'change',
    (event) => {
      const file = event.target.files?.[0];

      if (!file) return;

      state.pendingAudioFile = file;

      $('audio-file-name').textContent =
        file.name;

      $('audio-drop')?.classList.add('filled');
    }
  );

  $('cover-input')?.addEventListener(
    'change',
    (event) => {
      const file = event.target.files?.[0];

      if (!file) return;

      state.pendingCoverFile = file;

      const url = URL.createObjectURL(file);
      const preview = $('cover-preview');

      if (preview) {
        preview.style.backgroundImage =
          `url("${url}")`;
        preview.innerHTML = '';
      }

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 30000);
    }
  );

  $('lrc-input')?.addEventListener(
    'change',
    (event) => {
      const file = event.target.files?.[0];

      if (!file) return;

      state.pendingLrcFile = file;

      $('lrc-file-name').textContent =
        file.name;

      switchLyricsTab('upload');
    }
  );

  /* =========================================================
     Media Session API
  ========================================================= */

  function setupMediaSession(song) {
    if (!('mediaSession' in navigator) || !song) {
      return;
    }

    try {
      navigator.mediaSession.metadata =
        new MediaMetadata({
          title: song.title || 'Nocturne',
          artist: song.artist || '',
          album: song.album || 'Nocturne',
          artwork: song.coverBlob
            ? [
                {
                  src: getCoverURL(song),
                  sizes: '512x512',
                  type:
                    song.coverBlob.type ||
                    'image/jpeg'
                }
              ]
            : []
        });

      navigator.mediaSession.setActionHandler(
        'play',
        () => {
          audio.play().catch(() => {});
        }
      );

      navigator.mediaSession.setActionHandler(
        'pause',
        () => {
          audio.pause();
        }
      );

      navigator.mediaSession.setActionHandler(
        'previoustrack',
        () => {
          playPrevious();
        }
      );

      navigator.mediaSession.setActionHandler(
        'nexttrack',
        () => {
          playNext();
        }
      );

      try {
        navigator.mediaSession.setActionHandler(
          'seekbackward',
          (details) => {
            audio.currentTime = Math.max(
              0,
              audio.currentTime -
                (details.seekOffset || 10)
            );
          }
        );

        navigator.mediaSession.setActionHandler(
          'seekforward',
          (details) => {
            audio.currentTime = Math.min(
              audio.duration || Infinity,
              audio.currentTime +
                (details.seekOffset || 10)
            );
          }
        );

        navigator.mediaSession.setActionHandler(
          'seekto',
          (details) => {
            if (details.fastSeek && 'fastSeek' in audio) {
              audio.fastSeek(details.seekTime);
            } else {
              audio.currentTime = details.seekTime;
            }
          }
        );
      } catch (error) {
        console.warn(
          'Some Media Session actions are unsupported.',
          error
        );
      }

      updateMediaSessionPlaybackState();
    } catch (error) {
      console.warn(
        'Media Session setup failed:',
        error
      );
    }
  }

  function updateMediaSessionPlaybackState() {
    if (!('mediaSession' in navigator)) return;

    try {
      navigator.mediaSession.playbackState =
        state.isPlaying
          ? 'playing'
          : 'paused';
    } catch (error) {
      // Ignore unsupported browsers.
    }
  }

  /* =========================================================
     Event binding
  ========================================================= */

  function bindGlobalEvents() {
    /* Navigation */
    qsa('[data-view]').forEach((button) => {
      button.addEventListener('click', () => {
        const view = button.dataset.view;

        if (
          ['home', 'library', 'liked', 'playlists']
            .includes(view)
        ) {
          setView(view);
        }
      });
    });

    /* Full lyrics view: a manual scroll/swipe/wheel means the
       person wants to read around freely, so stop auto-centering
       the active line until they tap a lyric or the follow button. */
    const lyricsViewBody = qs('.lyrics-view-body');

    ['wheel', 'touchstart'].forEach((eventName) => {
      lyricsViewBody?.addEventListener(
        eventName,
        () => {
          state.lyricsAutoFollow = false;
          updateFollowButtonUI();
        },
        { passive: true }
      );
    });

    $('np-lyrics-preview')?.addEventListener(
      'click',
      openLyricsView
    );

    $('lyrics-view-close')?.addEventListener(
      'click',
      closeLyricsView
    );

    $('lyrics-follow-btn')?.addEventListener(
      'click',
      () => {
        state.lyricsAutoFollow = true;
        updateFollowButtonUI();

        const container = $('np-lyrics-list');

        const active = container
          ? qs(
              `.np-lyric-line[data-lyric-index="${state.activeLyricIndex}"]`,
              container
            )
          : null;

        if (active) {
          active.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
          });
        }
      }
    );

    /* Add song */
    $('fab-add')?.addEventListener(
      'click',
      () => openSongModal()
    );

    /* Mini player */
    $('mini-play')?.addEventListener(
      'click',
      togglePlay
    );

    $('mini-prev')?.addEventListener(
      'click',
      playPrevious
    );

    $('mini-next')?.addEventListener(
      'click',
      playNext
    );

    $('mini-shuffle')?.addEventListener(
      'click',
      toggleShuffle
    );

    $('mini-repeat')?.addEventListener(
      'click',
      toggleRepeat
    );

    $('mini-like')?.addEventListener(
      'click',
      async () => {
        const song = getCurrentSong();

        if (!song) return;

        const updated =
          await DB.toggleLike(song.id);

        if (updated) {
          replaceSong(updated);
          renderAll();
        }
      }
    );

    $('mini-track-info')?.addEventListener(
      'click',
      openNowPlaying
    );

    /* Now Playing */
    $('np-close')?.addEventListener(
      'click',
      closeNowPlaying
    );

    $('np-play')?.addEventListener(
      'click',
      togglePlay
    );

    $('np-prev')?.addEventListener(
      'click',
      playPrevious
    );

    $('np-next')?.addEventListener(
      'click',
      playNext
    );

    $('np-shuffle')?.addEventListener(
      'click',
      toggleShuffle
    );

    $('np-repeat')?.addEventListener(
      'click',
      toggleRepeat
    );

    $('np-menu')?.addEventListener(
      'click',
      (event) => {
        event.stopPropagation();

        const song = getCurrentSong();

        if (song) {
          openContextMenuFromElement(
            $('np-menu'),
            song.id
          );
        }
      }
    );

    /* Song form */
    $('song-form')?.addEventListener(
      'submit',
      handleSongFormSubmit
    );

    /* Playlist form */
    $('playlist-form')?.addEventListener(
      'submit',
      handlePlaylistSubmit
    );

    /* Lyrics tabs */
    qsa('.lyrics-tab').forEach((button) => {
      button.addEventListener('click', () => {
        switchLyricsTab(
          button.dataset.lyricsTab
        );
      });
    });

    /* New playlist */
    $('btn-new-playlist-side')?.addEventListener(
      'click',
      () => openPlaylistModal()
    );

    $('btn-create-playlist-inline')?.addEventListener(
      'click',
      () => {
        closeModal(
          $('modal-add-to-playlist')
        );

        setTimeout(() => {
          openPlaylistModal();
        }, 250);
      }
    );

    /* Search */
    $('search-input')?.addEventListener(
      'input',
      debounce((event) => {
        state.search = event.target.value;

        if (state.view === 'library') {
          renderLibrary();
        } else if (state.view === 'liked') {
          renderLiked();
        } else if (
          state.view === 'playlist-detail'
        ) {
          renderPlaylistDetail(
            state.playlistDetailId
          );
        }
      }, 150)
    );

    $('sort-select')?.addEventListener(
      'change',
      (event) => {
        state.sort = event.target.value;

        if (state.view === 'library') {
          renderLibrary();
        } else if (state.view === 'liked') {
          renderLiked();
        } else if (
          state.view === 'playlist-detail'
        ) {
          renderPlaylistDetail(
            state.playlistDetailId
          );
        }
      }
    );

    /* Close modal buttons */
    qsa('[data-close-modal]').forEach((button) => {
      button.addEventListener('click', () => {
        const modalId =
          button.dataset.closeModal;

        if (modalId === 'modal-confirm') {
          resolveConfirm(false);
        } else {
          closeModal($(modalId));
        }
      });
    });

    /* Overlay click */
    qsa('.modal-overlay').forEach((overlay) => {
      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) {
          if (overlay.id === 'modal-confirm') {
            resolveConfirm(false);
          } else {
            closeModal(overlay);
          }
        }
      });
    });

    /* Context menu */
    qsa('#context-menu button').forEach((button) => {
      button.addEventListener('click', () => {
        handleContextAction(
          button.dataset.action
        );
      });
    });

    /* Close context menu */
    document.addEventListener('click', (event) => {
      const menu = $('context-menu');

      if (
        menu &&
        !menu.contains(event.target) &&
        !event.target.closest(
          '[data-action="song-menu"]'
        )
      ) {
        closeContextMenu();
      }
    });

    /* Keyboard */
    document.addEventListener(
      'keydown',
      handleKeyboard
    );
  }

  function openContextMenuFromElement(
    element,
    songId
  ) {
    if (!element) return;

    const rect =
      element.getBoundingClientRect();

    const fakeEvent = {
      clientX: rect.left,
      clientY: rect.bottom + 8
    };

    openContextMenu(
      fakeEvent,
      songId,
      null
    );
  }

  /* =========================================================
     Keyboard shortcuts
  ========================================================= */

  function handleKeyboard(event) {
    const tag =
      document.activeElement?.tagName;

    const typing =
      tag === 'INPUT' ||
      tag === 'TEXTAREA' ||
      tag === 'SELECT';

    if (typing) return;

    if (event.code === 'Space') {
      event.preventDefault();
      togglePlay();
    }

    if (event.code === 'ArrowRight') {
      if (event.shiftKey) {
        audio.currentTime = Math.min(
          audio.duration || Infinity,
          audio.currentTime + 10
        );
      }
    }

    if (event.code === 'ArrowLeft') {
      if (event.shiftKey) {
        audio.currentTime = Math.max(
          0,
          audio.currentTime - 10
        );
      }
    }

    if (event.key === 'Escape') {
      closeLyricsView();
      closeNowPlaying();
      closeContextMenu();

      if (!$('modal-confirm').classList.contains('hidden')) {
        resolveConfirm(false);
      }

      qsa('.modal-overlay.show').forEach(
        closeModal
      );
    }
  }

  /* =========================================================
     Restore settings
  ========================================================= */

  async function restoreSettings() {
    try {
      const volume =
        await DB.getMeta('volume');

      if (typeof volume === 'number') {
        audio.volume =
          Math.min(1, Math.max(0, volume));

        if ($('mini-volume')) {
          $('mini-volume').value =
            Math.round(volume * 100);
        }
      } else {
        audio.volume = 0.8;
      }
    } catch (error) {
      audio.volume = 0.8;
    }
  }

  /* =========================================================
     Service Worker
  ========================================================= */

  async function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) {
      return;
    }

    /*
      Service worker registration is intentionally optional — this app
      works fully without it. It only adds PWA install / offline caching
      when service-worker.js is actually served alongside index.html
      (e.g. the multi-file project folder), so it's simply skipped
      when running as a single self-contained page (no such file exists,
      such as when published as a Claude artifact).
    */

    try {
      const check = await fetch('./service-worker.js', { method: 'HEAD' });

      if (!check.ok) return;

      await navigator.serviceWorker.register('./service-worker.js');
    } catch (error) {
      // No service-worker.js reachable in this context — expected and fine.
    }
  }

  /* =========================================================
     Initialisation
  ========================================================= */

  async function init() {
    bindGlobalEvents();

    await restoreSettings();

    await loadData();

    await registerServiceWorker();

    /* Restore last selected song only as metadata.
       Do NOT automatically start playback because
       browsers block autoplay. */

    const lastSongId =
      await DB.getMeta('lastSongId');

    if (
      lastSongId &&
      state.songs.some(
        (song) => song.id === lastSongId
      )
    ) {
      state.currentSongId = lastSongId;

      const song =
        state.songs.find(
          (item) => item.id === lastSongId
        );

      if (song) {
        state.queue =
          state.songs.map((item) => item.id);

        state.queueIndex =
          state.queue.indexOf(lastSongId);

        /*
          Don't load audio automatically here.
          User interaction is required on many browsers.

          Lyrics, however, don't need the audio element loaded —
          parse and show them now so the Now Playing screen isn't
          blank if the person opens it before pressing play.
        */
        updateLyrics(song);
      }
    }

    /* Save currently selected song whenever it changes. */
    window.addEventListener(
      'beforeunload',
      () => {
        if (state.currentSongId) {
          DB.setMeta(
            'lastSongId',
            state.currentSongId
          );
        }
      }
    );

    renderAll();

    console.log(
      '%cNocturne loaded.',
      'color:#8B6CFF;font-weight:bold;'
    );
  }

  /* =========================================================
     Start
  ========================================================= */

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      init
    );
  } else {
    init();
  }

})();

</script>
</body>
</html>
