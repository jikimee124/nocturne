<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nocturne — 나만의 음악 앱</title>
<meta name="theme-color" content="#0B0B12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nocturne" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Nocturne — personal music app
   Design tokens
=========================================================== */
:root{
  --bg:#0A0A10;
  --bg-elevated:#12121C;
  --surface:#1A1A27;
  --surface-hover:#232333;
  --surface-active:#2A2A3D;
  --border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.14);
  --text-primary:#F4F3F8;
  --text-secondary:#9997AC;
  --text-tertiary:#5F5D72;
  --accent:#8B6CFF;
  --accent-soft:rgba(139,108,255,0.16);
  --accent-2:#FF5C93;
  --accent-gradient:linear-gradient(135deg,#8B6CFF 0%,#FF5C93 100%);
  --danger:#FF5C6C;
  --radius-sm:9px;
  --radius-md:14px;
  --radius-lg:22px;
  --radius-xl:28px;
  --pill:999px;
  --shadow-1:0 2px 10px rgba(0,0,0,0.35);
  --shadow-2:0 12px 34px rgba(0,0,0,0.45);
  --shadow-glow:0 10px 40px rgba(139,108,255,0.28);
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.68,0,1);
  --sidebar-w:260px;
  --mini-h:96px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:var(--font-display);margin:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ===========================================================
   App shell
=========================================================== */
#app{display:flex;min-height:100vh;}

/* ---------- Sidebar (desktop) ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:28px 18px 18px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 26px;}
.brand-mark{
  width:34px;height:34px;border-radius:11px;
  background:var(--accent-gradient);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:16px;
  box-shadow:var(--shadow-glow);
}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-0.01em;}

.side-nav{display:flex;flex-direction:column;gap:4px;margin-bottom:26px;}
.side-nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:var(--radius-md);
  font-size:14.5px;font-weight:500;color:var(--text-secondary);
  transition:background .18s var(--ease),color .18s var(--ease);
  text-align:left;
}
.side-nav-item .icon{font-size:16px;width:20px;text-align:center;}
.side-nav-item:hover{background:var(--surface);color:var(--text-primary);}
.side-nav-item.active{background:var(--accent-soft);color:var(--text-primary);}

.side-section-label{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--text-tertiary);
  padding:6px 12px;margin-top:6px;
}
.side-playlists{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:40px;}
.side-playlist-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-md);
  font-size:14px;color:var(--text-secondary);
  transition:background .18s var(--ease),color .18s var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.side-playlist-item:hover{background:var(--surface);color:var(--text-primary);}
.side-playlist-item.active{background:var(--surface);color:var(--text-primary);}
.side-playlist-item .emoji{font-size:14px;}
.side-playlist-item .name{overflow:hidden;text-overflow:ellipsis;}

.side-create-playlist{
  margin-top:14px;padding:11px 12px;border-radius:var(--radius-md);
  font-size:13.5px;color:var(--text-secondary);border:1px dashed var(--border-strong);
  transition:all .18s var(--ease);
}
.side-create-playlist:hover{color:var(--text-primary);border-color:var(--accent);background:var(--accent-soft);}

/* ---------- Main content ---------- */
#main-content{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(10,10,16,0.92) 70%,rgba(10,10,16,0));
  backdrop-filter:blur(10px);
  padding:26px 36px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
#page-title{font-size:24px;font-weight:700;letter-spacing:-0.01em;}
.topbar-search{display:flex;gap:10px;flex:1;justify-content:flex-end;max-width:520px;}
.topbar-search input[type=search]{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--pill);padding:10px 16px;font-size:13.5px;color:var(--text-primary);
  transition:border-color .18s;
}
.topbar-search input[type=search]:focus{border-color:var(--accent);}
.topbar-search select{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--pill);
  padding:10px 14px;font-size:13px;color:var(--text-secondary);
}

.page{padding:6px 36px 40px;}
.content-spacer{height:180px;}

/* ===========================================================
   Home page
=========================================================== */
.home-section{margin-bottom:38px;}
.home-section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.home-section-title{font-family:var(--font-display);font-size:17px;font-weight:600;}
.home-section-link{font-size:12.5px;color:var(--text-tertiary);}
.home-section-link:hover{color:var(--accent);}

.hcard-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.hcard-row::-webkit-scrollbar{display:none;}

.hcard{
  flex:0 0 152px;cursor:pointer;
}
.hcard-cover{
  width:152px;height:152px;border-radius:var(--radius-md);
  background:var(--surface);background-size:cover;background-position:center;
  box-shadow:var(--shadow-1);margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--text-tertiary);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
  position:relative;overflow:hidden;
}
.hcard:hover .hcard-cover{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow-2);}
.hcard-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:152px;}
.hcard-sub{font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:152px;margin-top:2px;}

.hcard-play{
  position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;
  background:var(--accent-gradient);color:#fff;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(6px);transition:all .2s var(--ease);font-size:13px;box-shadow:var(--shadow-glow);
}
.hcard:hover .hcard-play{opacity:1;transform:translateY(0);}

.empty-state{
  padding:60px 20px;text-align:center;color:var(--text-tertiary);
}
.empty-state .emoji{font-size:38px;display:block;margin-bottom:12px;}
.empty-state .title{color:var(--text-secondary);font-weight:600;font-size:15px;margin-bottom:4px;}
.empty-state .desc{font-size:13px;}

/* ===========================================================
   Song list / library
=========================================================== */
.song-list{display:flex;flex-direction:column;}
.song-row{
  display:grid;grid-template-columns:44px 1fr auto auto auto;align-items:center;gap:14px;
  padding:9px 10px;border-radius:var(--radius-md);
  transition:background .15s var(--ease);
  position:relative;
}
.song-row:hover{background:var(--surface);}
.song-row.playing{background:var(--accent-soft);}

/* Draggable rows (playlist detail only) get an extra handle column */
.song-row[draggable="true"]{grid-template-columns:18px 44px 1fr auto auto auto;cursor:grab;}
@media (min-width:900px){.song-row[draggable="true"]{grid-template-columns:18px 44px 1.3fr 1fr auto auto;}}
.song-row[draggable="true"]:active{cursor:grabbing;}
.song-row-drag-handle{
  color:var(--text-tertiary);font-size:14px;text-align:center;user-select:none;
  opacity:0;transition:opacity .15s;
}
.song-row[draggable="true"]:hover .song-row-drag-handle{opacity:.7;}
.song-row.dragging{opacity:.4;}
.song-row.drag-over-top{box-shadow:inset 0 2px 0 0 var(--accent);}
.song-row.drag-over-bottom{box-shadow:inset 0 -2px 0 0 var(--accent);}
.song-row-cover{
  width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-tertiary);flex-shrink:0;
  position:relative;
}
.song-row-play-overlay{
  position:absolute;inset:0;border-radius:var(--radius-sm);background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .15s;font-size:13px;
}
.song-row:hover .song-row-play-overlay{opacity:1;}
.song-row-text{min-width:0;}
.song-row-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-row.playing .song-row-title{color:var(--accent);}
.song-row-sub{font-size:12.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.song-row-album{font-size:12.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;}
@media (min-width:900px){.song-row{grid-template-columns:44px 1.3fr 1fr auto auto;}.song-row-album{display:block;}}

.playing-eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:6px;vertical-align:middle;}
.playing-eq span{width:2.5px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite;}
.playing-eq span:nth-child(2){animation-delay:.2s;}
.playing-eq span:nth-child(3){animation-delay:.4s;}
@keyframes eq{0%,100%{height:3px;}50%{height:12px;}}

.icon-btn{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);font-size:15px;transition:all .15s var(--ease);flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text-primary);}
.icon-btn.liked{color:var(--accent-2);}

.section-title-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-title-bar h2{font-size:20px;font-weight:700;}
.pill-count{font-size:12px;color:var(--text-tertiary);font-weight:500;}

/* ===========================================================
   Playlist grid & detail
=========================================================== */
.playlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;}
.playlist-card{
  border-radius:var(--radius-lg);padding:16px;background:var(--surface);
  cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease);
}
.playlist-card:hover{background:var(--surface-hover);transform:translateY(-3px);}
.playlist-card-cover{
  width:100%;aspect-ratio:1/1;border-radius:var(--radius-md);margin-bottom:12px;
  background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:var(--shadow-1);
}
.playlist-card-name{font-weight:600;font-size:14.5px;}
.playlist-card-count{font-size:12px;color:var(--text-tertiary);margin-top:3px;}
.playlist-card.new{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px dashed var(--border-strong);background:transparent;min-height:190px;
}
.playlist-card.new:hover{border-color:var(--accent);background:var(--accent-soft);}

.playlist-detail-header{display:flex;gap:22px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;}
.playlist-detail-cover{
  width:170px;height:170px;border-radius:var(--radius-lg);background:var(--accent-gradient);
  display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:var(--shadow-glow);flex-shrink:0;
}
.playlist-detail-meta{flex:1;min-width:200px;}
.playlist-detail-label{font-size:12px;color:var(--text-tertiary);font-weight:600;letter-spacing:.02em;}
.playlist-detail-name{font-family:var(--font-display);font-size:32px;font-weight:800;margin:6px 0 8px;letter-spacing:-0.01em;}
.playlist-detail-count{font-size:13px;color:var(--text-secondary);}
.playlist-detail-actions{display:flex;gap:10px;margin-top:16px;}

/* ===========================================================
   Buttons
=========================================================== */
.btn-primary{
  background:var(--accent-gradient);color:#fff;padding:11px 20px;border-radius:var(--pill);
  font-weight:600;font-size:14px;transition:filter .15s,transform .15s;box-shadow:var(--shadow-glow);
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-primary.danger{background:var(--danger);box-shadow:none;}
.btn-primary.danger:hover{filter:brightness(1.1);}
.confirm-message{font-size:14px;line-height:1.6;color:var(--text-secondary);white-space:pre-line;margin-bottom:18px;}
.btn-secondary{
  background:var(--surface);color:var(--text-primary);padding:11px 20px;border-radius:var(--pill);
  font-weight:600;font-size:14px;border:1px solid var(--border-strong);transition:background .15s;
}
.btn-secondary:hover{background:var(--surface-hover);}
.btn-secondary.full-width{width:100%;margin-top:12px;}
.btn-icon-pill{
  display:flex;align-items:center;gap:8px;background:var(--surface);padding:10px 18px;border-radius:var(--pill);
  font-size:13.5px;font-weight:600;color:var(--text-primary);border:1px solid var(--border-strong);
}
.btn-icon-pill:hover{background:var(--surface-hover);}
.btn-icon-pill.primary{background:var(--accent-gradient);border:none;box-shadow:var(--shadow-glow);}

/* ===========================================================
   Floating add button
=========================================================== */
.fab{
  position:fixed;right:28px;bottom:calc(var(--mini-h) + 24px);z-index:40;
  display:flex;align-items:center;gap:8px;
  background:var(--accent-gradient);color:#fff;
  padding:15px 22px 15px 18px;border-radius:var(--pill);
  box-shadow:var(--shadow-glow);
  font-weight:600;font-size:14.5px;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.fab:hover{transform:translateY(-2px) scale(1.02);}
.fab:active{transform:scale(.96);}
.fab-plus{font-size:19px;line-height:1;}

/* ===========================================================
   Mini player
=========================================================== */
.mini-player{
  position:fixed;left:var(--sidebar-w);right:0;bottom:0;height:var(--mini-h);z-index:30;
  background:rgba(18,18,28,0.88);backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  transform:translateY(0);transition:transform .3s var(--ease);
}
.mini-player.slide-out{transform:translateY(110%);}
.mini-progress{height:3px;width:100%;background:rgba(255,255,255,0.06);cursor:pointer;}
.mini-progress-fill{height:100%;background:var(--accent-gradient);width:0%;transition:width .12s linear;}
.mini-inner{
  height:calc(100% - 3px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 20px;gap:16px;
}
.mini-track{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;}
.mini-cover{
  width:52px;height:52px;border-radius:var(--radius-sm);background:var(--surface);background-size:cover;background-position:center;
  box-shadow:var(--shadow-1);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-tertiary);
}
.mini-text{min-width:0;}
.mini-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.mini-artist{font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.mini-like{font-size:16px;margin-left:4px;flex-shrink:0;transition:transform .15s;}
.mini-like:hover{transform:scale(1.15);}
.mini-controls{display:flex;align-items:center;gap:6px;justify-content:center;}
.ctrl-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:15px;transition:all .15s;}
.ctrl-btn:hover{color:var(--text-primary);background:var(--surface-hover);}
.ctrl-btn.active-toggle{color:var(--accent);}
.ctrl-play{
  width:42px;height:42px;background:#fff;color:#0A0A10;font-size:15px;
}
.ctrl-play:hover{background:#fff;transform:scale(1.05);}
.mini-extra{display:flex;align-items:center;gap:10px;justify-content:flex-end;}
.mini-time{font-size:11.5px;color:var(--text-tertiary);white-space:nowrap;font-variant-numeric:tabular-nums;}
.seek-bar,.vol-bar{
  -webkit-appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);outline:none;
}
.seek-bar{width:160px;}
.vol-bar{width:80px;}
.seek-bar::-webkit-slider-thumb,.vol-bar::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(139,108,255,0.35);cursor:pointer;
}
.seek-bar::-moz-range-thumb,.vol-bar::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:none;cursor:pointer;}
.vol-icon{font-size:13px;color:var(--text-tertiary);}

/* ===========================================================
   Now Playing full screen
=========================================================== */
.now-playing{
  position:fixed;inset:0;z-index:100;
  background:#0A0A10;
  display:flex;flex-direction:column;
  transform:translateY(100%);opacity:0;
  transition:transform .42s var(--ease),opacity .32s var(--ease);
  overflow:hidden;
}
.now-playing.show{transform:translateY(0);opacity:1;}
.np-bg{
  position:absolute;inset:-10%;background-size:cover;background-position:center;
  filter:blur(60px) saturate(1.4) brightness(.55);opacity:.55;transition:background-image .4s;z-index:0;
}
.np-header{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 18px;
  padding-top:calc(30px + env(safe-area-inset-top, 0px));
}
.np-icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0;border:none;}
.np-icon-btn:hover{background:rgba(255,255,255,0.16);}
.np-header-text{font-size:12px;letter-spacing:.05em;color:rgba(255,255,255,0.6);font-weight:600;}

.np-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:6px 24px 40px;max-width:640px;margin:0 auto;width:100%;}
.np-art-wrap{width:min(280px,62vw);margin-top:6px;}
.np-art{
  width:100%;aspect-ratio:1/1;border-radius:var(--radius-xl);background:var(--surface);background-size:cover;background-position:center;
  box-shadow:0 30px 60px rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--text-tertiary);
  transition:transform .3s var(--ease);
}
.np-meta{text-align:center;margin-top:22px;max-width:90%;}
.np-title{font-family:var(--font-display);font-size:21px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-artist{font-size:14px;color:rgba(255,255,255,0.55);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.np-progress-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:24px;}
.np-time{font-size:11px;color:rgba(255,255,255,0.45);font-variant-numeric:tabular-nums;width:38px;flex-shrink:0;}
#np-seek{width:100%;}

.np-controls{display:flex;align-items:center;gap:20px;margin-top:20px;}
.np-ctrl-btn{color:rgba(255,255,255,0.75);font-size:19px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.np-ctrl-btn:hover{background:rgba(255,255,255,0.08);}
.np-ctrl-btn.active-toggle{color:var(--accent-2);}
.np-play-btn{width:60px;height:60px;background:#fff;color:#0A0A10;font-size:20px;}
.np-play-btn:hover{transform:scale(1.05);background:#fff;}

/* Compact lyrics preview (lives inside Now Playing) */
.np-lyrics{width:100%;margin-top:32px;position:relative;}
.np-lyrics-empty{text-align:center;color:rgba(255,255,255,0.35);font-size:13.5px;padding:24px 0;}
.np-lyrics-preview{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius-lg);padding:8px 18px 12px;display:flex;flex-direction:column;align-items:center;
  transition:background .15s,border-color .15s;
}
.np-lyrics-preview:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.16);}
.np-lyrics-preview-viewport{
  width:100%;height:84px;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%);
}
.np-lyrics-preview-track{
  display:flex;flex-direction:column;align-items:center;
  transition:transform .45s var(--ease);
  will-change:transform;
}
.np-lyrics-preview-row{
  height:28px;width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:rgba(255,255,255,0.4);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;
  transition:color .3s var(--ease),font-size .3s var(--ease);
}
.np-lyrics-preview-row.current{font-size:15.5px;color:#fff;}
.np-lyrics-preview-hint{font-size:10.5px;color:rgba(255,255,255,0.32);margin-top:4px;letter-spacing:.02em;}

/* Full-screen lyrics view (opened by tapping the preview) */
.lyrics-view{
  position:fixed;inset:0;z-index:110;
  background:#0A0A10;
  display:flex;flex-direction:column;
  transform:translateY(100%);opacity:0;
  transition:transform .38s var(--ease),opacity .3s var(--ease);
  overflow:hidden;
}
.lyrics-view.show{transform:translateY(0);opacity:1;}
.lyrics-view-header{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;
  padding-top:calc(30px + env(safe-area-inset-top, 0px));
  flex-shrink:0;
}
.lyrics-view-body{
  flex:1;overflow-y:auto;padding:20px 24px calc(60px + env(safe-area-inset-bottom, 0px));
  max-width:640px;margin:0 auto;width:100%;
}
.lyrics-view .np-lyrics-list{display:flex;flex-direction:column;align-items:center;gap:22px;padding:40vh 0;}
.lyrics-view .np-lyric-line{
  font-size:17px;color:rgba(255,255,255,0.35);text-align:center;font-weight:600;
  transform:scale(.94);transition:transform .38s var(--ease),color .38s var(--ease),opacity .38s var(--ease);
  opacity:.55;cursor:pointer;line-height:1.5;padding:2px 10px;
}
.lyrics-view .np-lyric-line:hover{color:rgba(255,255,255,0.7);}
.lyrics-view .np-lyric-line.active{font-size:23px;color:#fff;transform:scale(1.04);opacity:1;}
.lyrics-view .np-lyric-line.near{opacity:.5;}
#lyrics-follow-btn.active-toggle{color:var(--accent-2);background:rgba(255,92,147,0.14);}

/* ===========================================================
   Modals
=========================================================== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(5,5,10,0.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;transition:opacity .22s var(--ease);
}
.modal-overlay.show{opacity:1;}
.modal-card{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-2);
  transform:translateY(16px) scale(.98);transition:transform .26s var(--ease);
}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1);}
.modal-card.small{max-width:400px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px;}
.modal-header h2{font-size:18px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:50%;color:var(--text-secondary);font-size:15px;}
.modal-close:hover{background:var(--surface);color:var(--text-primary);}
.modal-body{padding:16px 22px 24px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.field input[type=text],.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;color:var(--text-primary);transition:border-color .15s;
}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;font-family:var(--font-body);line-height:1.5;}
.field-row{display:flex;gap:12px;}
.field-row.two-col > .field{flex:1;min-width:0;}
.field-row.emoji-row{align-items:flex-start;}
.field.emoji-field{width:70px;}
.field.emoji-field input{text-align:center;font-size:20px;}
.field.grow{flex:1;}

.cover-picker{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.cover-preview{
  width:84px;height:84px;border-radius:var(--radius-md);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text-tertiary);
  background-size:cover;background-position:center;flex-shrink:0;border:1px solid var(--border);
  cursor:pointer;transition:border-color .15s,filter .15s;
}
.cover-preview:hover{border-color:var(--accent);filter:brightness(1.08);}
.cover-picker-label{
  font-size:13px;font-weight:600;color:var(--accent);padding:9px 16px;border-radius:var(--pill);
  border:1px solid var(--accent);cursor:pointer;transition:background .15s;
}
.cover-picker-label:hover{background:var(--accent-soft);}

.file-drop{
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);padding:18px 14px;
  font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;
}
.file-drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--text-primary);}
.file-drop.small{padding:12px;}
.file-drop.filled{border-color:var(--accent);color:var(--text-primary);border-style:solid;}

.lyrics-tabs{display:flex;gap:6px;margin-bottom:10px;}
.lyrics-tab{
  flex:1;padding:8px 10px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;
  color:var(--text-tertiary);background:var(--surface);border:1px solid var(--border);
}
.lyrics-tab.active{color:#fff;background:var(--accent-gradient);border-color:transparent;}
.lyrics-tab-panel{margin-top:2px;}

.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.add-to-playlist-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;margin-bottom:6px;}
.atp-item{
  display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--radius-md);cursor:pointer;
  transition:background .15s;
}
.atp-item:hover{background:var(--surface);}
.atp-emoji{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.atp-name{flex:1;font-size:14px;font-weight:500;}
.atp-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.atp-item.checked .atp-check{background:var(--accent-gradient);border-color:transparent;color:#fff;}

/* ===========================================================
   Context menu
=========================================================== */
.context-menu{
  position:fixed;z-index:250;background:var(--bg-elevated);border:1px solid var(--border-strong);
  border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:6px;min-width:200px;
  opacity:0;transform:scale(.95) translateY(-4px);transition:all .14s var(--ease);pointer-events:none;
}
.context-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.context-menu button{
  display:flex;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--text-primary);gap:8px;
}
.context-menu button:hover{background:var(--surface);}
.context-menu button.danger-item{color:var(--danger);}
.context-menu button.danger-item:hover{background:rgba(255,92,108,0.12);}

/* ===========================================================
   Toasts
=========================================================== */
#toast-container{position:fixed;bottom:calc(var(--mini-h) + 90px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--bg-elevated);border:1px solid var(--border-strong);color:var(--text-primary);
  padding:11px 20px;border-radius:var(--pill);font-size:13px;font-weight:500;box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(8px);transition:all .25s var(--ease);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ===========================================================
   Mobile bottom nav (hidden on desktop)
=========================================================== */
#mobile-nav{display:none;}

/* ===========================================================
   Responsive
=========================================================== */
@media (max-width:900px){
  :root{--mini-h:76px;}
  #sidebar{display:none;}
  .mini-player{left:0;}
  #topbar{padding:20px 18px 12px;}
  .page{padding:6px 18px 30px;}
  #mobile-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;z-index:35;
    background:rgba(18,18,28,0.95);backdrop-filter:blur(18px);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-tertiary);font-size:10.5px;font-weight:600;}
  .mnav-item .icon{font-size:18px;}
  .mnav-item.active{color:var(--accent);}
  .mini-player{bottom:64px;}
  .fab{bottom:calc(64px + var(--mini-h) + 16px);right:16px;padding:14px 16px;}
  .fab-label{display:none;}
  .mini-inner{grid-template-columns:1fr auto;padding:0 12px;gap:8px;}
  .mini-extra{display:none;}
  .mini-controls{gap:2px;}
  .mini-title,.mini-artist{max-width:140px;}
  .topbar-search{width:100%;max-width:none;}
  .field-row.two-col{flex-direction:column;}
  .np-art-wrap{width:min(280px,72vw);}
  .content-spacer{height:220px;}
}
@media (max-width:480px){
  .playlist-grid{grid-template-columns:repeat(2,1fr);}
  .hcard{flex:0 0 128px;}
  .hcard-cover{width:128px;height:128px;}
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *{transition-duration:0.01ms !important;animation-duration:0.01ms !important;}
}

</style>
</head>
<body>

<div id="app">

  <!-- ============ Desktop sidebar ============ -->
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">N</span>
      <span class="brand-name">Nocturne</span>
    </div>

    <nav class="side-nav">
      <button class="side-nav-item active" data-view="home">
        <span class="icon">🏠</span><span>홈</span>
      </button>
      <button class="side-nav-item" data-view="library">
        <span class="icon">🎵</span><span>내 음악</span>
      </button>
      <button class="side-nav-item" data-view="liked">
        <span class="icon">❤️</span><span>좋아요</span>
      </button>
      <button class="side-nav-item" data-view="playlists">
        <span class="icon">📋</span><span>플레이리스트</span>
      </button>
    </nav>

    <div class="side-section-label">내 플레이리스트</div>
    <div class="side-playlists" id="side-playlists"></div>

    <button class="side-create-playlist" id="btn-new-playlist-side">+ 새 플레이리스트</button>
  </aside>

  <!-- ============ Main content ============ -->
  <main id="main-content">
    <header id="topbar">
      <h1 id="page-title">홈</h1>
      <div id="topbar-search" class="topbar-search hidden">
        <input type="search" id="search-input" placeholder="제목, 아티스트, 앨범 검색" />
        <select id="sort-select">
          <option value="addedAt">최근 추가순</option>
          <option value="lastPlayedAt">최근 재생순</option>
          <option value="title">제목순</option>
          <option value="artist">아티스트순</option>
        </select>
      </div>
    </header>

    <section id="page-home" class="page"></section>
    <section id="page-library" class="page hidden"></section>
    <section id="page-liked" class="page hidden"></section>
    <section id="page-playlists" class="page hidden"></section>
    <section id="page-playlist-detail" class="page hidden"></section>

    <div class="content-spacer"></div>
  </main>

  <!-- ============ Mobile bottom nav ============ -->
  <nav id="mobile-nav">
    <button class="mnav-item active" data-view="home"><span class="icon">🏠</span><span>홈</span></button>
    <button class="mnav-item" data-view="library"><span class="icon">🎵</span><span>내 음악</span></button>
    <button class="mnav-item" data-view="liked"><span class="icon">❤️</span><span>좋아요</span></button>
    <button class="mnav-item" data-view="playlists"><span class="icon">📋</span><span>목록</span></button>
  </nav>

  <!-- ============ Floating add button ============ -->
  <button id="fab-add" class="fab" aria-label="노래 추가">
    <span class="fab-plus">+</span><span class="fab-label">노래 추가</span>
  </button>

  <!-- ============ Mini player ============ -->
  <div id="mini-player" class="mini-player hidden">
    <div class="mini-progress"><div class="mini-progress-fill" id="mini-progress-fill"></div></div>
    <div class="mini-inner">
      <div class="mini-track" id="mini-track-info">
        <div class="mini-cover" id="mini-cover"></div>
        <div class="mini-text">
          <div class="mini-title" id="mini-title">재생 중인 곡 없음</div>
          <div class="mini-artist" id="mini-artist">곡을 선택해서 재생해보세요</div>
        </div>
        <button class="mini-like" id="mini-like">🤍</button>
      </div>
      <div class="mini-controls">
        <button class="ctrl-btn" id="mini-shuffle" title="셔플">🔀</button>
        <button class="ctrl-btn" id="mini-prev" title="이전 곡">⏮</button>
        <button class="ctrl-btn ctrl-play" id="mini-play" title="재생/일시정지">▶</button>
        <button class="ctrl-btn" id="mini-next" title="다음 곡">⏭</button>
        <button class="ctrl-btn" id="mini-repeat" title="반복">🔁</button>
      </div>
      <div class="mini-extra">
        <span class="mini-time" id="mini-time">0:00 / 0:00</span>
        <input type="range" id="mini-seek" min="0" max="100" value="0" class="seek-bar" />
        <span class="vol-icon">🔊</span>
        <input type="range" id="mini-volume" min="0" max="100" value="80" class="vol-bar" />
      </div>
    </div>
  </div>

  <!-- ============ Now Playing full screen ============ -->
  <div id="now-playing" class="now-playing hidden">
    <div class="np-bg" id="np-bg"></div>
    <div class="np-header">
      <button id="np-close" class="np-icon-btn">⌄</button>
      <div class="np-header-text">지금 재생 중</div>
      <button id="np-menu" class="np-icon-btn">⋯</button>
    </div>

    <div class="np-body">
      <div class="np-art-wrap">
        <div class="np-art" id="np-cover"></div>
      </div>

      <div class="np-meta">
        <div class="np-title" id="np-title">—</div>
        <div class="np-artist" id="np-artist">—</div>
      </div>

      <div class="np-progress-row">
        <span class="np-time" id="np-current-time">0:00</span>
        <input type="range" id="np-seek" min="0" max="100" value="0" class="seek-bar" />
        <span class="np-time" id="np-total-time">0:00</span>
      </div>

      <div class="np-controls">
        <button class="np-ctrl-btn" id="np-shuffle" title="셔플">🔀</button>
        <button class="np-ctrl-btn" id="np-prev" title="이전 곡">⏮</button>
        <button class="np-ctrl-btn np-play-btn" id="np-play" title="재생/일시정지">▶</button>
        <button class="np-ctrl-btn" id="np-next" title="다음 곡">⏭</button>
        <button class="np-ctrl-btn" id="np-repeat" title="반복">🔁</button>
      </div>

      <div class="np-lyrics" id="np-lyrics">
        <div class="np-lyrics-empty" id="np-lyrics-empty">등록된 가사가 없어요</div>

        <button
          type="button"
          class="np-lyrics-preview hidden"
          id="np-lyrics-preview"
          aria-label="가사 전체 보기"
        >
          <div class="np-lyrics-preview-viewport">
            <div class="np-lyrics-preview-track" id="np-lyrics-preview-track"></div>
          </div>
          <div class="np-lyrics-preview-hint">가사 전체 보기 ⌃</div>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Full lyrics view ============ -->
  <div id="lyrics-view" class="lyrics-view hidden">
    <div class="lyrics-view-header">
      <button id="lyrics-view-close" class="np-icon-btn">⌄</button>
      <div class="np-header-text">가사</div>
      <button id="lyrics-follow-btn" class="np-icon-btn" title="현재 재생 위치로 이동">⦿</button>
    </div>

    <div class="lyrics-view-body" id="lyrics-view-body">
      <div class="np-lyrics-list" id="np-lyrics-list"></div>
    </div>
  </div>

  <!-- ============ Modal: Add / Edit song ============ -->
  <div id="modal-song" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="song-modal-title">노래 추가</h2>
        <button class="modal-close" data-close-modal="modal-song">✕</button>
      </div>
      <div class="modal-body">
        <form id="song-form">
          <input type="hidden" id="song-id" />

          <div class="cover-picker" id="cover-picker">
            <div class="cover-preview" id="cover-preview">
              <span class="cover-placeholder">🖼️</span>
            </div>
            <label class="cover-picker-label">
              앨범 커버 선택
              <input type="file" id="cover-input" accept="image/*" hidden />
            </label>
          </div>

          <div class="field-row two-col">
            <div class="field">
              <label>곡 제목 *</label>
              <input type="text" id="field-title" required placeholder="곡 제목" />
            </div>
            <div class="field">
              <label>아티스트 *</label>
              <input type="text" id="field-artist" required placeholder="아티스트" />
            </div>
          </div>

          <div class="field-row two-col">
            <div class="field">
              <label>앨범명</label>
              <input type="text" id="field-album" placeholder="앨범명" />
            </div>
            <div class="field">
              <label>발매년도</label>
              <input type="text" id="field-year" placeholder="예: 2024" inputmode="numeric" />
            </div>
          </div>

          <div class="field">
            <label>장르</label>
            <input type="text" id="field-genre" placeholder="예: Pop, R&B, Jazz" />
          </div>

          <div class="field" id="audio-field">
            <label>음악 파일 *</label>
            <label class="file-drop" id="audio-drop">
              <span id="audio-file-name">MP3, WAV, M4A 파일을 선택하세요</span>
              <input type="file" id="audio-input" accept="audio/*" hidden />
            </label>
          </div>

          <div class="field">
            <label>가사</label>
            <div class="lyrics-tabs">
              <button type="button" class="lyrics-tab active" data-lyrics-tab="upload">LRC 파일 업로드</button>
              <button type="button" class="lyrics-tab" data-lyrics-tab="type">직접 입력</button>
            </div>
            <div class="lyrics-tab-panel" id="lyrics-panel-upload">
              <label class="file-drop small">
                <span id="lrc-file-name">.lrc 파일 선택 (선택사항)</span>
                <input type="file" id="lrc-input" hidden />
              </label>
            </div>
            <div class="lyrics-tab-panel hidden" id="lyrics-panel-type">
              <textarea id="lyrics-textarea" rows="6" placeholder="가사를 한 줄씩 입력하세요. 시간 없이 저장돼요."></textarea>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" data-close-modal="modal-song">취소</button>
            <button type="submit" class="btn-primary" id="song-form-submit">저장</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ============ Modal: Create / rename playlist ============ -->
  <div id="modal-playlist" class="modal-overlay hidden">
    <div class="modal-card small">
      <div class="modal-header">
        <h2 id="playlist-modal-title">새 플레이리스트</h2>
        <button class="modal-close" data-close-modal="modal-playlist">✕</button>

<script>

/* ===== db.js ===== */
/* ===========================================================
   db.js — IndexedDB persistence layer
   All songs (with audio/cover blobs), playlists, likes, and
   playback history live here. Nothing ever leaves the device.
=========================================================== */

const DB_NAME = 'nocturne-music-db';
const DB_VERSION = 1;

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;

      if (!db.objectStoreNames.contains('songs')) {
        const songs = db.createObjectStore('songs', { keyPath: 'id' });
        songs.createIndex('addedAt', 'addedAt');
        songs.createIndex('lastPlayedAt', 'lastPlayedAt');
        songs.createIndex('title', 'title');
        songs.createIndex('artist', 'artist');
        songs.createIndex('liked', 'liked');
      }

      if (!db.objectStoreNames.contains('playlists')) {
        const pl = db.createObjectStore('playlists', { keyPath: 'id' });
        pl.createIndex('createdAt', 'createdAt');
      }

      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
    };

    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}

function tx(storeNames, mode) {
  return openDB().then((db) => db.transaction(storeNames, mode));
}

function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ---------------- Songs ---------------- */

async function addSong(song) {
  const t = await tx(['songs'], 'readwrite');
  const store = t.objectStore('songs');
  const record = {
    id: uuid(),
    title: song.title || '알 수 없는 제목',
    artist: song.artist || '알 수 없는 아티스트',
    album: song.album || '',
    year: song.year || '',
    genre: song.genre || '',
    coverBlob: song.coverBlob || null,
    audioBlob: song.audioBlob,
    audioType: song.audioType || '',
    duration: song.duration || 0,
    lyricsType: song.lyricsType || 'none', // 'lrc' | 'plain' | 'none'
    lyricsRaw: song.lyricsRaw || '',
    liked: false,
    addedAt: Date.now(),
    lastPlayedAt: 0,
    playCount: 0
  };
  await reqToPromise(store.add(record));
  return record;
}

async function updateSong(id, changes) {
  const t = await tx(['songs'], 'readwrite');
  const store = t.objectStore('songs');
  const existing = await reqToPromise(store.get(id));
  if (!existing) return null;
  const updated = Object.assign({}, existing, changes);
  await reqToPromise(store.put(updated));
  return updated;
}

async function deleteSong(id) {
  const t = await tx(['songs', 'playlists'], 'readwrite');
  const songs = t.objectStore('songs');
  await reqToPromise(songs.delete(id));
  const plStore = t.objectStore('playlists');
  const all = await reqToPromise(plStore.getAll());
  for (const pl of all) {
    if (pl.songIds && pl.songIds.includes(id)) {
      pl.songIds = pl.songIds.filter((sid) => sid !== id);
      await reqToPromise(plStore.put(pl));
    }
  }
}

async function getAllSongs() {
  const t = await tx(['songs'], 'readonly');
  return reqToPromise(t.objectStore('songs').getAll());
}

async function getSong(id) {
  const t = await tx(['songs'], 'readonly');
  return reqToPromise(t.objectStore('songs').get(id));
}

async function toggleLike(id) {
  const song = await getSong(id);
  if (!song) return null;
  return updateSong(id, { liked: !song.liked });
}

async function recordPlay(id) {
  const song = await getSong(id);
  if (!song) return;
  await updateSong(id, {
    lastPlayedAt: Date.now(),
    playCount: (song.playCount || 0) + 1
  });
  const recent = (await getMeta('recentlyPlayed')) || [];
  const filtered = recent.filter((sid) => sid !== id);
  filtered.unshift(id);
  await setMeta('recentlyPlayed', filtered.slice(0, 40));
}

/* ---------------- Playlists ---------------- */

async function addPlaylist({ name, emoji }) {
  const t = await tx(['playlists'], 'readwrite');
  const store = t.objectStore('playlists');
  const record = {
    id: uuid(),
    name: name || '새 플레이리스트',
    emoji: emoji || '🎵',
    songIds: [],
    createdAt: Date.now()
  };
  await reqToPromise(store.add(record));
  return record;
}

async function updatePlaylist(id, changes) {
  const t = await tx(['playlists'], 'readwrite');
  const store = t.objectStore('playlists');
  const existing = await reqToPromise(store.get(id));
  if (!existing) return null;
  const updated = Object.assign({}, existing, changes);
  await reqToPromise(store.put(updated));
  return updated;
}

async function deletePlaylist(id) {
  const t = await tx(['playlists'], 'readwrite');
  await reqToPromise(t.objectStore('playlists').delete(id));
}

async function getAllPlaylists() {
  const t = await tx(['playlists'], 'readonly');
  return reqToPromise(t.objectStore('playlists').getAll());
}

async function getPlaylist(id) {
  const t = await tx(['playlists'], 'readonly');
  return reqToPromise(t.objectStore('playlists').get(id));
}

async function addSongToPlaylist(playlistId, songId) {
  const pl = await getPlaylist(playlistId);
  if (!pl) return null;
  if (!pl.songIds.includes(songId)) {
    pl.songIds.push(songId);
    return updatePlaylist(playlistId, { songIds: pl.songIds });
  }
  return pl;
}

async function removeSongFromPlaylist(playlistId, songId) {
  const pl = await getPlaylist(playlistId);
  if (!pl) return null;
  pl.songIds = pl.songIds.filter((id) => id !== songId);
  return updatePlaylist(playlistId, { songIds: pl.songIds });
}

/* ---------------- Meta / settings ---------------- */

async function getMeta(key) {
  const t = await tx(['meta'], 'readonly');
  const rec = await reqToPromise(t.objectStore('meta').get(key));
  return rec ? rec.value : undefined;
}

async function setMeta(key, value) {
  const t = await tx(['meta'], 'readwrite');
  await reqToPromise(t.objectStore('meta').put({ key, value }));
}

const DB = {
  addSong, updateSong, deleteSong, getAllSongs, getSong, toggleLike, recordPlay,
  addPlaylist, updatePlaylist, deletePlaylist, getAllPlaylists, getPlaylist,
  addSongToPlaylist, removeSongFromPlaylist,
  getMeta, setMeta
};

/* ===== lyrics.js ===== */
/* ===========================================================
   lyrics.js — LRC parsing + active-line lookup
=========================================================== */

const LRC_LINE_RE = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

/**
 * Parses raw LRC text into [{ time: seconds|null, text: string }]
 * Falls back gracefully if timestamps are missing.
 */
function parseLRC(raw) {
  if (!raw) return [];
  const lines = raw.split(/\r?\n/);
  const result = [];

  for (const line of lines) {
    const matches = [...line.matchAll(LRC_LINE_RE)];
    const text = line.replace(LRC_LINE_RE, '').trim();
    if (matches.length === 0) {
      if (text) result.push({ time: null, text });
      continue;
    }
    for (const m of matches) {
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const fracRaw = m[3] || '0';
      const frac = parseInt(fracRaw.padEnd(3, '0').slice(0, 3), 10) / 1000;
      const time = min * 60 + sec + frac;
      if (text) result.push({ time, text });
    }
  }

  result.sort((a, b) => {
    if (a.time === null && b.time === null) return 0;
    if (a.time === null) return 1;
    if (b.time === null) return -1;
    return a.time - b.time;
  });

  return result;
}

/** Splits plain (non-timed) lyrics into line objects. */
function parsePlainLyrics(raw) {
  if (!raw) return [];
  return raw
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter((l) => l.length > 0)
    .map((text) => ({ time: null, text }));
}

/**
 * Given timed lyric lines (sorted ascending) and the current playback
 * time, returns the index of the line that should be active.
 */
function getActiveLyricIndex(lines, currentTime) {
  if (!lines || lines.length === 0) return -1;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].time === null) continue;
    if (lines[i].time <= currentTime + 0.05) {
      idx = i;
    } else {
      break;
    }
  }
  return idx;
}

function lyricsHasTimings(lines) {
  return lines.some((l) => l.time !== null);
}

/* ===== app.js ===== */
/* ===========================================================
   app.js — Nocturne application controller
   Compatible with:
   - db.js
   - lyrics.js
   - index.html
   - style.css
=========================================================== */

(() => {
  'use strict';

  /* =========================================================
     State
  ========================================================= */

  const state = {
    view: 'home',
    playlistDetailId: null,

    songs: [],
    playlists: [],

    currentSongId: null,
    queue: [],
    queueIndex: -1,

    isPlaying: false,
    shuffle: false,
    repeat: 'off', // off | all | one

    search: '',
    sort: 'addedAt',

    currentLyrics: [],
    activeLyricIndex: -1,
    lyricsAutoFollow: true,

    audioObjectUrl: null,
    coverObjectUrls: new Map(),

    editingSongId: null,
    editingPlaylistId: null,

    contextSongId: null,
    contextPlaylistId: null,

    pendingAudioFile: null,
    pendingCoverFile: null,
    pendingLrcFile: null,

    modalLyricsTab: 'upload'
  };

  const audio = document.getElementById('audio-el');

  /* =========================================================
     DOM helpers
  ========================================================= */

  const $ = (id) => document.getElementById(id);

  function qs(selector, parent = document) {
    return parent.querySelector(selector);
  }

  function qsa(selector, parent = document) {
    return [...parent.querySelectorAll(selector)];
  }

  function escapeHTML(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';

    const total = Math.floor(seconds);
    const minutes = Math.floor(total / 60);
    const secs = total % 60;

    return `${minutes}:${String(secs).padStart(2, '0')}`;
  }

  function showToast(message, duration = 2200) {
    const container = $('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;

    container.appendChild(toast);

    requestAnimationFrame(() => {
      toast.classList.add('show');
    });

    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  function debounce(fn, wait = 250) {
    let timer = null;

    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), wait);
    };
  }

  function isMobile() {
    return window.matchMedia('(max-width: 900px)').matches;
  }

  /* =========================================================
     Image / Blob helpers
  ========================================================= */

  function revokeCoverURL(songId) {
    const url = state.coverObjectUrls.get(songId);

    if (url) {
      URL.revokeObjectURL(url);
      state.coverObjectUrls.delete(songId);
    }
  }

  function getCoverURL(song) {
    if (!song || !song.coverBlob) return '';

    if (!state.coverObjectUrls.has(song.id)) {
      state.coverObjectUrls.set(
        song.id,
        URL.createObjectURL(song.coverBlob)
      );
    }

    return state.coverObjectUrls.get(song.id);
  }

  function coverStyle(song) {
    const url = getCoverURL(song);

    if (!url) {
      return '';
    }

    // No inner quotes: this string gets embedded both as an HTML
    // style="..." attribute (home cards, song rows) and assigned via
    // JS .style (mini player, Now Playing). Quoting the url() value
    // breaks the former, since the embedded " prematurely closes the
    // HTML attribute — blob: URLs never need quoting in CSS anyway.
    return `background-image:url(${url})`;
  }

  /* =========================================================
     Data loading
  ========================================================= */

  async function loadData() {
    try {
      state.songs = await DB.getAllSongs();
      state.playlists = await DB.getAllPlaylists();

      renderAll();
      renderSidebarPlaylists();
    } catch (error) {
      console.error(error);
      showToast('음악 데이터를 불러오지 못했어요.');
    }
  }

  /* =========================================================
     Navigation
  ========================================================= */

  function setView(view, playlistId = null) {
    state.view = view;
    state.playlistDetailId = playlistId;

    qsa('.side-nav-item').forEach((button) => {
      button.classList.toggle(
        'active',
        button.dataset.view === view
      );
    });

    qsa('.mnav-item').forEach((button) => {
      button.classList.toggle(
        'active',
        button.dataset.view === view
      );
    });

    qsa('.page').forEach((page) => {
      page.classList.add('hidden');
    });

    let pageId = `page-${view}`;

    if (view === 'playlist-detail') {
      pageId = 'page-playlist-detail';
    }

    const page = $(pageId);

    if (page) {
      page.classList.remove('hidden');
    }

    const titles = {
      home: '홈',
      library: '내 음악',
      liked: '좋아요',
      playlists: '플레이리스트',
      'playlist-detail': '플레이리스트'
    };

    $('page-title').textContent =
      view === 'playlist-detail'
        ? getPlaylistName(playlistId)
        : titles[view] || 'Nocturne';

    const searchArea = $('topbar-search');

    if (searchArea) {
      searchArea.classList.toggle(
        'hidden',
        !['library', 'liked', 'playlist-detail'].includes(view)
      );
    }

    if (view === 'playlist-detail') {
      renderPlaylistDetail(playlistId);
    }

    renderAll();
  }

  function getPlaylistName(id) {
    const playlist = state.playlists.find((p) => p.id === id);
    return playlist ? playlist.name : '플레이리스트';
  }

  /* =========================================================
     Rendering
  ========================================================= */

  function renderAll() {
    renderHome();
    renderLibrary();
    renderLiked();
    renderPlaylists();

    if (state.view === 'playlist-detail') {
      renderPlaylistDetail(state.playlistDetailId);
    }

    renderSidebarPlaylists();
    renderMiniPlayer();
    renderNowPlaying();
  }

  function getFilteredSongs(songs = state.songs) {
    const query = state.search.trim().toLowerCase();

    let result = [...songs];

    if (query) {
      result = result.filter((song) => {
        return [
          song.title,
          song.artist,
          song.album,
          song.genre
        ].some((value) =>
          String(value || '').toLowerCase().includes(query)
        );
      });
    }

    result.sort((a, b) => {
      switch (state.sort) {
        case 'title':
          return a.title.localeCompare(b.title, 'ko');

        case 'artist':
          return a.artist.localeCompare(b.artist, 'ko');

        case 'lastPlayedAt':
          return (b.lastPlayedAt || 0) - (a.lastPlayedAt || 0);

        case 'addedAt':
        default:
          return (b.addedAt || 0) - (a.addedAt || 0);
      }
    });

    return result;
  }

  function renderHome() {
    const page = $('page-home');
    if (!page) return;

    const recent = [...state.songs]
      .filter((song) => song.lastPlayedAt)
      .sort((a, b) => b.lastPlayedAt - a.lastPlayedAt)
      .slice(0, 8);

    const added = [...state.songs]
      .sort((a, b) => b.addedAt - a.addedAt)
      .slice(0, 8);

    const liked = state.songs
      .filter((song) => song.liked)
      .slice(0, 8);

    page.innerHTML = `
      ${
        recent.length
          ? `
            <section class="home-section">
              <div class="home-section-header">
                <h2 class="home-section-title">최근 재생</h2>
              </div>
              <div class="hcard-row">
                ${recent.map(renderHomeCard).join('')}
              </div>
            </section>
          `
          : ''
      }

      <section class="home-section">
        <div class="home-section-header">
          <h2 class="home-section-title">최근 추가한 음악</h2>
        </div>

        ${
          added.length
            ? `<div class="hcard-row">${added.map(renderHomeCard).join('')}</div>`
            : renderEmptyState(
                '🎵',
                '아직 음악이 없어요',
                '오른쪽 아래의 + 노래 추가 버튼으로 음악을 추가해보세요.'
              )
        }
      </section>

      ${
        liked.length
          ? `
            <section class="home-section">
              <div class="home-section-header">
                <h2 class="home-section-title">좋아요</h2>
              </div>
              <div class="hcard-row">
                ${liked.map(renderHomeCard).join('')}
              </div>
            </section>
          `
          : ''
      }

      ${
        state.playlists.length
          ? `
            <section class="home-section">
              <div class="home-section-header">
                <h2 class="home-section-title">플레이리스트</h2>
              </div>
              <div class="hcard-row">
                ${state.playlists
                  .slice()
                  .sort((a, b) => b.createdAt - a.createdAt)
                  .map(renderPlaylistHomeCard)
                  .join('')}
              </div>
            </section>
          `
          : ''
      }
    `;

    bindHomeEvents(page);
  }

  function renderHomeCard(song) {
    return `
      <div class="hcard" data-song-id="${song.id}">
        <div
          class="hcard-cover"
          style="${coverStyle(song)}"
        >
          ${
            song.coverBlob
              ? ''
              : '<span>♪</span>'
          }

          <button
            class="hcard-play"
            data-action="play-song"
            data-song-id="${song.id}"
            aria-label="재생"
          >▶</button>
        </div>

        <div class="hcard-title">${escapeHTML(song.title)}</div>
        <div class="hcard-sub">${escapeHTML(song.artist)}</div>
      </div>
    `;
  }

  function renderPlaylistHomeCard(playlist) {
    return `
      <div
        class="hcard"
        data-playlist-id="${playlist.id}"
        data-action="open-playlist"
      >
        <div class="hcard-cover playlist-home-cover">
          <span>${escapeHTML(playlist.emoji || '🎵')}</span>
        </div>

        <div class="hcard-title">${escapeHTML(playlist.name)}</div>
        <div class="hcard-sub">${playlist.songIds.length}곡</div>
      </div>
    `;
  }

  function renderLibrary() {
    const page = $('page-library');
    if (!page) return;

    const songs = getFilteredSongs();

    page.innerHTML = `
      <div class="section-title-bar">
        <h2>내 음악</h2>
        <span class="pill-count">${songs.length}곡</span>
      </div>

      ${
        songs.length
          ? renderSongList(songs)
          : renderEmptyState(
              '🎵',
              '음악이 없어요',
              state.search
                ? '검색 결과가 없습니다.'
                : '오른쪽 아래의 + 노래 추가 버튼으로 음악을 추가하세요.'
            )
      }
    `;

    bindSongListEvents(page);
  }

  function renderLiked() {
    const page = $('page-liked');
    if (!page) return;

    const likedSongs = state.songs.filter((song) => song.liked);
    const songs = getFilteredSongs(likedSongs);

    page.innerHTML = `
      <div class="section-title-bar">
        <h2>좋아요</h2>
        <span class="pill-count">${songs.length}곡</span>
      </div>

      ${
        songs.length
          ? renderSongList(songs)

  /* =========================================================
     Playlist song reordering (drag & drop)
  ========================================================= */

  let dragState = null;

  function bindPlaylistReorder(page, playlistId) {
    const rows = qsa('.song-row[draggable="true"]', page);

    if (!rows.length) return;

    rows.forEach((row) => {
      row.addEventListener('dragstart', (event) => {
        dragState = { songId: row.dataset.songId };
        row.classList.add('dragging');

        try {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', row.dataset.songId);
        } catch (error) {
          // Some browsers restrict dataTransfer access; safe to ignore.
        }
      });

      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        rows.forEach((r) => r.classList.remove('drag-over-top', 'drag-over-bottom'));
        dragState = null;
      });

      row.addEventListener('dragover', (event) => {
        if (!dragState || dragState.songId === row.dataset.songId) return;

        event.preventDefault();

        const rect = row.getBoundingClientRect();
        const isBefore = event.clientY - rect.top < rect.height / 2;

        row.classList.toggle('drag-over-top', isBefore);
        row.classList.toggle('drag-over-bottom', !isBefore);
      });

      row.addEventListener('dragleave', () => {
        row.classList.remove('drag-over-top', 'drag-over-bottom');
      });

      row.addEventListener('drop', async (event) => {
        event.preventDefault();

        row.classList.remove('drag-over-top', 'drag-over-bottom');

        if (!dragState || dragState.songId === row.dataset.songId) return;

        const rect = row.getBoundingClientRect();
        const isBefore = event.clientY - rect.top < rect.height / 2;

        await reorderPlaylistSong(
          playlistId,
          dragState.songId,
          row.dataset.songId,
          isBefore
        );
      });
    });
  }

  async function reorderPlaylistSong(playlistId, draggedId, targetId, insertBefore) {
    const playlist = state.playlists.find((p) => p.id === playlistId);

    if (!playlist || !playlist.songIds) return;

    const ids = playlist.songIds.filter((id) => id !== draggedId);
    let targetIndex = ids.indexOf(targetId);

    if (targetIndex === -1) {
      targetIndex = ids.length;
    } else if (!insertBefore) {
      targetIndex += 1;
    }

    ids.splice(targetIndex, 0, draggedId);

    try {
      const updated = await DB.updatePlaylist(playlistId, { songIds: ids });

      if (updated) {
        replacePlaylist(updated);

        if (state.view === 'playlist-detail' && state.playlistDetailId === playlistId) {
          renderPlaylistDetail(playlistId);
        }
      }
    } catch (error) {
      console.error(error);
      showToast('순서를 저장하지 못했어요.');
    }
  }

  /* =========================================================
     Playback
  ========================================================= */

  async function playSong(songId, queueIds = null) {
    const song = state.songs.find(
      (item) => item.id === songId
    );

    if (!song || !song.audioBlob) {
      showToast('재생할 음악 파일이 없습니다.');
      return;
    }

    try {
      if (queueIds) {
        state.queue = [...queueIds];
      } else if (!state.queue.length || !state.queue.includes(songId)) {
        state.queue = state.songs.map((s) => s.id);
      }

      state.queueIndex = state.queue.indexOf(songId);

      if (state.currentSongId === songId && audio.src) {
        await audio.play();
        state.isPlaying = true;
        renderAll();
        return;
      }

      await loadSongIntoAudio(song);

      state.currentSongId = songId;
      state.isPlaying = false;
      state.activeLyricIndex = -1;

      await DB.recordPlay(songId);

      const updated = await DB.getSong(songId);

      if (updated) {
        replaceSong(updated);
      }

      audio.currentTime = 0;

      await audio.play();

      state.isPlaying = true;

      setupMediaSession(song);
      renderAll();
    } catch (error) {
      console.error(error);
      state.isPlaying = false;

      if (error.name === 'NotAllowedError') {
        showToast('재생 버튼을 한 번 더 눌러주세요.');
      } else {
        showToast('음악을 재생할 수 없습니다.');
      }
    }
  }

  async function loadSongIntoAudio(song) {
    if (state.audioObjectUrl) {
      URL.revokeObjectURL(state.audioObjectUrl);
      state.audioObjectUrl = null;
    }

    state.audioObjectUrl = URL.createObjectURL(
      song.audioBlob
    );

    audio.src = state.audioObjectUrl;
    audio.load();

    await new Promise((resolve, reject) => {
      const onLoaded = () => {
        cleanup();
        resolve();
      };

      const onError = () => {
        cleanup();
        reject(audio.error || new Error('Audio load failed'));
      };

      const cleanup = () => {
        audio.removeEventListener('loadedmetadata', onLoaded);
        audio.removeEventListener('error', onError);
      };

      audio.addEventListener('loadedmetadata', onLoaded);
      audio.addEventListener('error', onError);
    });

    if (!song.duration && Number.isFinite(audio.duration)) {
      const updated = await DB.updateSong(song.id, {
        duration: audio.duration
      });

      if (updated) {
        replaceSong(updated);
      }
    }

    updateLyrics(song);
  }

  async function togglePlay() {
    if (!state.currentSongId) {
      if (state.songs.length) {
        await playSong(state.songs[0].id);
      } else {
        showToast('먼저 음악을 추가해주세요.');
      }

      return;
    }

    try {
      if (audio.paused) {
        await audio.play();
        state.isPlaying = true;
      } else {
        audio.pause();
        state.isPlaying = false;
      }

      renderMiniPlayer();
      renderNowPlaying();
      updateMediaSessionPlaybackState();
    } catch (error) {
      console.error(error);
    }
  }

  async function playNext() {
    if (!state.queue.length) {
      state.queue = state.songs.map((song) => song.id);
    }

    if (!state.queue.length) return;

    if (state.repeat === 'one') {
      audio.currentTime = 0;
      await audio.play();
      return;
    }

    let nextIndex;

    if (state.shuffle) {
      if (state.queue.length === 1) {
        nextIndex = 0;
      } else {
        const possible = state.queue
          .map((_, index) => index)
          .filter((index) => index !== state.queueIndex);

        nextIndex =
          possible[Math.floor(Math.random() * possible.length)];
      }
    } else {
      nextIndex = state.queueIndex + 1;
    }

    if (nextIndex >= state.queue.length) {
      if (state.repeat === 'all') {
        nextIndex = 0;
      } else {
        state.isPlaying = false;
        renderAll();
        return;
      }
    }

    state.queueIndex = nextIndex;

    await playSong(
      state.queue[state.queueIndex],
      state.queue
    );
  }

  async function playPrevious() {
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    if (!state.queue.length) {
      state.queue = state.songs.map((song) => song.id);
    }

    if (!state.queue.length) return;

    let previousIndex = state.queueIndex - 1;

    if (previousIndex < 0) {
      previousIndex =
        state.repeat === 'all'
          ? state.queue.length - 1
          : 0;
    }

    state.queueIndex = previousIndex;

    await playSong(
      state.queue[state.queueIndex],
      state.queue
    );
  }

  function toggleShuffle() {
    state.shuffle = !state.shuffle;

    showToast(
      state.shuffle
        ? '셔플 재생 켜짐'

  function toggleRepeat() {
    const modes = ['off', 'all', 'one'];
    const index = modes.indexOf(state.repeat);

    state.repeat = modes[(index + 1) % modes.length];

    const messages = {
      off: '반복 재생 꺼짐',
      all: '전체 반복',
      one: '한 곡 반복'

  /* =========================================================
     Audio events
  ========================================================= */

  audio.addEventListener('play', () => {
    state.isPlaying = true;

    const song = getCurrentSong();

  audio.addEventListener('timeupdate', () => {
    updateProgress();
    updateLyricsPosition();
  });

  audio.addEventListener('durationchange', () => {

  audio.addEventListener('loadedmetadata', () => {
    updateProgress();

    console.error('Audio error:', audio.error);
  });

  function updateProgress() {
    const duration = Number.isFinite(audio.duration)
      ? audio.duration
      : 0;

    const current = Number.isFinite(audio.currentTime)
      ? audio.currentTime
      : 0;

    const percentage =
      duration > 0
        ? (current / duration) * 100
        : 0;

    const miniFill = $('mini-progress-fill');

    if (miniFill) {
      miniFill.style.width = `${percentage}%`;
    }

    const miniSeek = $('mini-seek');

    if (miniSeek && document.activeElement !== miniSeek) {
      miniSeek.value = percentage;
    }

    const npSeek = $('np-seek');

    if (npSeek && document.activeElement !== npSeek) {
      npSeek.value = percentage;
    }

    if ($('mini-time')) {
      $('mini-time').textContent =
        `${formatTime(current)} / ${formatTime(duration)}`;
    }

    if ($('np-current-time')) {
      $('np-current-time').textContent =
        formatTime(current);
    }

    if ($('np-total-time')) {
      $('np-total-time').textContent =
        formatTime(duration);
    }
  }

  /* =========================================================
     Seek
  ========================================================= */

  function seekFromRange(value) {
    const duration = audio.duration;

    if (!Number.isFinite(duration) || duration <= 0) {
      return;
    }

    audio.currentTime =
      (Number(value) / 100) * duration;
  }

  $('mini-seek')?.addEventListener('input', (event) => {
    seekFromRange(event.target.value);
  });

  $('np-seek')?.addEventListener('input', (event) => {
    seekFromRange(event.target.value);
  });

  $('mini-volume')?.addEventListener('input', (event) => {
    const value = Number(event.target.value) / 100;

    audio.volume = value;

    DB.setMeta('volume', value);
  });

  /* =========================================================
     Lyrics
  ========================================================= */

  function updateLyrics(song) {
    if (!song) {
      state.currentLyrics = [];
      state.activeLyricIndex = -1;
      return;
    }

    let lines = [];

    if (song.lyricsType === 'lrc') {
      lines = parseLRC(song.lyricsRaw || '');
    } else if (song.lyricsType === 'plain') {
      lines = parsePlainLyrics(song.lyricsRaw || '');
    }

    state.currentLyrics = lines;
    state.activeLyricIndex = -1;
    state.lyricsAutoFollow = true;

    updateFollowButtonUI();
    renderLyrics();
  }

  function renderLyrics() {
    const container = $('np-lyrics-list');
    const empty = $('np-lyrics-empty');

    if (!container || !empty) return;

    if (!state.currentLyrics.length) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      renderLyricsPreview();
      return;
    }

    empty.classList.add('hidden');

    container.innerHTML = state.currentLyrics
      .map((line, index) => `
        <div
          class="np-lyric-line"
          data-lyric-index="${index}"
        >
          ${escapeHTML(line.text)}
        </div>
      `)
      .join('');

    qsa('.np-lyric-line', container).forEach((element) => {
      element.addEventListener('click', () => {
        const index = Number(
          element.dataset.lyricIndex
        );

        const line = state.currentLyrics[index];

        if (
          line &&
          line.time !== null &&
          Number.isFinite(line.time)
        ) {
          state.lyricsAutoFollow = true;
          updateFollowButtonUI();

          audio.currentTime = line.time;

          if (audio.paused) {
            audio.play().catch(() => {});
          }
        }
      });
    });

    updateLyricsPosition();
    renderLyricsPreview();
  }

  const LYRIC_PREVIEW_ROW_HEIGHT = 28; // px — must match .np-lyrics-preview-row height in CSS

  /* Compact 3-line preview shown inside Now Playing; tapping it
     opens the full scrollable lyrics view. Built as a small sliding
     "ticker" track (one leading + one trailing spacer row so the
     very first/last lyric can still sit centered) so line changes
     animate smoothly instead of just swapping text. */
  function renderLyricsPreview() {
    const wrap = $('np-lyrics-preview');
    const empty = $('np-lyrics-empty');
    const track = $('np-lyrics-preview-track');

    if (!wrap || !empty || !track) return;

    const lines = state.currentLyrics;

    if (!lines.length) {
      wrap.classList.add('hidden');
      empty.classList.remove('hidden');
      track.innerHTML = '';
      return;
    }

    empty.classList.add('hidden');
    wrap.classList.remove('hidden');

    track.innerHTML =
      `<div class="np-lyrics-preview-row" data-index="-1"></div>` +
      lines
        .map(
          (line, i) => `
            <div class="np-lyrics-preview-row" data-index="${i}">
              ${escapeHTML(line.text)}
            </div>
          `
        )
        .join('') +
      `<div class="np-lyrics-preview-row" data-index="${lines.length}"></div>`;

    updateLyricsPreviewPosition();
  }

  /* Slides the preview track so the active line sits in the center
     slot; runs on every playback tick, separately from the (heavier)
     full rebuild in renderLyricsPreview() above. */
  function updateLyricsPreviewPosition() {
    const track = $('np-lyrics-preview-track');

    if (!track) return;

    const lines = state.currentLyrics;

    if (!lines.length) return;

    const hasTiming = lyricsHasTimings(lines);
    const idx =
      hasTiming && state.activeLyricIndex >= 0
        ? state.activeLyricIndex
        : 0;

    track.style.transform =
      `translateY(${-idx * LYRIC_PREVIEW_ROW_HEIGHT}px)`;

    qsa('.np-lyrics-preview-row', track).forEach((row) => {
      row.classList.toggle(
        'current',
        Number(row.dataset.index) === idx
      );
    });
  }

  function updateLyricsPosition() {
    const lines = state.currentLyrics;

    if (!lines.length) return;

    const hasTiming = lyricsHasTimings(lines);

    if (!hasTiming) {
      return;
    }

    const index = getActiveLyricIndex(
      lines,
      audio.currentTime
    );

    if (index === state.activeLyricIndex) {
      return;
    }

    state.activeLyricIndex = index;

    updateLyricsPreviewPosition();

    const container = $('np-lyrics-list');

    if (!container) return;

    const elements = qsa(
      '.np-lyric-line',
      container
    );

    elements.forEach((element, i) => {
      element.classList.toggle(
        'active',
        i === index
      );

      element.classList.toggle(
        'near',
        Math.abs(i - index) <= 2
      );
    });

    if (
      index >= 0 &&
      elements[index] &&
      state.lyricsAutoFollow
    ) {
      const active = elements[index];

      active.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }
  }

  /* =========================================================
     Mini player
  ========================================================= */

  function getCurrentSong() {
    return state.songs.find(
      (song) => song.id === state.currentSongId
    ) || null;
  }

  function renderMiniPlayer() {
    const player = $('mini-player');

    if (!player) return;

    const song = getCurrentSong();

    if (!song) {
      player.classList.add('hidden');
      return;
    }

    player.classList.remove('hidden');

    const cover = $('mini-cover');

    if (cover) {
      cover.style = coverStyle(song);
      cover.textContent = song.coverBlob ? '' : '♪';
    }

    if ($('mini-title')) {
      $('mini-title').textContent = song.title;
    }

    if ($('mini-artist')) {
      $('mini-artist').textContent = song.artist;
    }

    if ($('mini-play')) {
      $('mini-play').textContent =
        state.isPlaying ? 'Ⅱ' : '▶';
    }

    if ($('mini-like')) {
      $('mini-like').textContent =
        song.liked ? '❤️' : '🤍';
    }

    $('mini-shuffle')?.classList.toggle(
      'active-toggle',
      state.shuffle
    );

    $('mini-repeat')?.classList.toggle(
      'active-toggle',
      state.repeat !== 'off'
    );

    updateProgress();
  }

  /* =========================================================
     Now Playing
  ========================================================= */

  function renderNowPlaying() {
    const song = getCurrentSong();

    if (!song) return;

    const cover = $('np-cover');

    if (cover) {
      cover.style = coverStyle(song);
      cover.textContent = song.coverBlob ? '' : '♪';
    }

    const bg = $('np-bg');

    if (bg) {
      bg.style = coverStyle(song);
    }

    if ($('np-title')) {
      $('np-title').textContent = song.title;
    }

    if ($('np-artist')) {
      $('np-artist').textContent = song.artist;
    }

    if ($('np-play')) {
      $('np-play').textContent =
        state.isPlaying ? 'Ⅱ' : '▶';
    }

    $('np-shuffle')?.classList.toggle(
      'active-toggle',
      state.shuffle
    );

    $('np-repeat')?.classList.toggle(
      'active-toggle',
      state.repeat !== 'off'
    );

    renderLyrics();
    updateProgress();
  }

  function openNowPlaying() {
    const overlay = $('now-playing');

    if (!overlay || !state.currentSongId) return;

    renderNowPlaying();

    overlay.classList.remove('hidden');

    requestAnimationFrame(() => {
      overlay.classList.add('show');

    document.body.style.overflow = 'hidden';

  /* =========================================================
     Full lyrics view
  ========================================================= */

  function openLyricsView() {
    const overlay = $('lyrics-view');

    if (!overlay || !state.currentLyrics.length) return;

    overlay.classList.remove('hidden');
